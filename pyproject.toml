[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rrs-admin"
version = "0.1.0"
description = "Site keys and site setup for Pinout Report Service, run by the people who operate it"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13,<4.0"
license = {file = "LICENSE"}
dependencies = [
    "pynacl>=1.6.2",
    "pyyaml>=6.0.3",
    "substrate-interface>=1.8.1",
]

[project.scripts]
rrs-admin = "rrs_admin.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rrs_admin"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/rrs_admin/chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
